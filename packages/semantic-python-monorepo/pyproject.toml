[tool.poetry]
name = "semantic-python-monorepo"
version = "0.6.0"
description = "A tool to manage a monorepo of poetry packages"
authors = ["CHC, Technology"]
readme = "README.md"
packages = [{include = "semantic_python_monorepo", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
rich = "^13.9.4"
toml = "^0.10.2"

[tool.poetry.scripts]
spm = "semantic_python_monorepo.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-xdist = "^3.6.1"
pytest-watch = "^4.2.0"
pytest-sugar = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-monorepo.deps]
