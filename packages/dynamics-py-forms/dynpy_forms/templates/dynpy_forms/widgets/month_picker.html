<span class="month-picker"
      x-data="{ month_value: '{{ widget.month_value }}' }">
    <input id="id_{{ widget.name }}"
           name="{{ widget.name }}"
           type="month"
           x-model="month_value"
           {% include "django/forms/widgets/attrs.html" %}>
    {% if widget.attrs.show_clear_button %}
        <button type="button"
            class="btn btn-sm btn-link text-dark p-0 position-absolute"
            style="opacity: .7;
            top: 3.2rem;
            right: {{ widget.right_position|default:'1.35%' }};
            transform: translate(-50%, -50%)"
            :disabled="month_value === ''"
            {# djlint:off #}
                @click="month_value = ''; $nextTick(() => { 
                    const container = $event.target.closest('.month-picker');
                    container.querySelector('input[type=\'month\']').dispatchEvent(new Event('change', { bubbles: true })); });"
            {# djlint:on #}>
            <i class="fas fa-times"></i>
        </button>
    {% endif %}
</span>
