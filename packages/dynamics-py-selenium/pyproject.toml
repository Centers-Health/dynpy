[tool.poetry]
name = "dynpy_selenium"
version = "1.1.0"
description = ""
authors = ["Team Dynamics"]

[[tool.poetry.source]]
name = "dynamics"
url = "https://pypi.centershealthcare.org/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.djlint]
profile = "django"
blank_line_before_tag="block"
blank_line_after_tag="endblock,extends"
format_attribute_template_tags=true
max_line_length=105
preserve_leading_space=false
preserve_blank_lines=false

[tool.flakeheaven]
ignore = ["E203", "E266", "E501", "W503", "F403", "F401", "E231", "-PIE786"]
format = "colored"
max_line_length = 105
max_complexity = 18
show_source = true
select = ["B","C","E","F","W","T4","B9"]
exclude = [".git","__pycache__","docs/source/conf.py","old","build","dist",".venv"]
baseline = "flake8_baseline.txt"

[tool.flakeheaven.plugins]
pyflakes = ["+*"]
# E722 covered by bugabear with better message
pycodestyle = ["+*", "-E501", "-E722"]
flake8-bugbear = ["+*"]
flake8-simplify = ["+*"]
# PIE786 covered by bugabear with better message
flake8-pie = ["+*", "-PIE786"]
flake8-alfred = ["+*"]
flake8-pytest = ["+*"]
flake8-pytest-style = ["+*"]

[tool.pycln]
all = true
expand_stars = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 105

[tool.poetry.dependencies]
python = "^3.11"
selenium = "^4.2.0"
webdriver-manager = "^3.7.0"
packaging = "^21.3"

[tool.poetry.group.dev.dependencies]
pdbpp = "*"
pytest = "^7.4.3"
pytest-xdist = "^2.5.0"
pytest-describe = "^2.0.1"
django-types = "^0.17.0"

[tool.semantic_release]
version_variable = [
    "dynpy_selenium/__init__.py:__version__"
]
version_toml = [
    "pyproject.toml:tool.poetry.version"
]
upload_to_pypi = false
upload_to_repository = false
upload_to_release = true
build_command = "poetry build"
commit_message = "Automatically generated by python-semantic-release [skip ci]"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-monorepo.deps]
