default_stages: [commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: check-yaml
        name: "Yaml: Check"
      - id: end-of-file-fixer
        name: "General: Fix end of files"
      - id: trailing-whitespace
        name: "General: Fix Trailing whitespace"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v2.2.1"
    hooks:
      - id: prettier
        name: "JS> Prettier"
        files: '.*\.js$'

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: "v7.25.0"
    hooks:
      - id: eslint
        name: "JS> Eslint"

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: "v2.0.0"
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]

  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
        name: "Py> Black Formatter"
        files: '.*\.py$'
        language_version: python3.11

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        name: "Py> Sort Imports"
        files: '.*\.py$'

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.32.1
    hooks:
      - id: djlint-django
        name: Django djLint
        files: '.*\.html$'

  - repo: https://github.com/flakeheaven/flakeheaven
    rev: 3.3.0
    hooks:
      - id: flakeheaven
        name: Py> Flake8 Linter
        files: '.*\.py$'
        additional_dependencies:
          - flake8-bugbear==22.12.6
          - flake8-django==1.2
          - flake8-simplify==0.19.3
          - flake8-pie==0.15.0
          - flake8-alfred==1.1.1
          - flake8-pytest==1.4
          - flake8-pytest-style==1.7.2

  - repo: https://github.com/hadialqattan/pycln
    rev: v2.2.2
    hooks:
      - id: pycln
        name: "Python: Remove unused imports"
        args: [--config=pyproject.toml]
        files: '.*\.py$'

  - repo: local
    hooks:
      - id: djlint-django
        name: Django djLint
        entry: .venv/bin/djlint --profile=django --quiet --reformat
        language: system
        files: '.*\.html$'

      - id: naive-check-merge-conflict
        name: "Git: Check Merge Conflicts"
        entry: "^(<<<<<<< |======= |>>>>>>> |=======$)"
        language: pygrep
        stages: [push]
        always_run: true

      - id: check-empty-endblock
        name: "Django: Missing blockname for endblock in template"
        entry: "{%\\s*endblock\\s*%}"
        language: pygrep
        stages: [commit]
        types: [html]
