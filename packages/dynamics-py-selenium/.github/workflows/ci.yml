name: CI

on:
  pull_request:
    branches: [master]

env:
  DOCKER_CONFIG: /home/enviro/.docker/dynamics-py-selenium-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
  DOCKER_CMD: docker-compose -f docker-compose.ci.yml
  COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}-ci-${{ github.event.pull_request.number }}
  IMAGE_NAME: dynpy-selenium-${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  CI:
    runs-on: [self-hosted, ciplus]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PKG_TOKEN }}
          logout: false

      - uses: actions/checkout@v4

      - name: Verify conventional commits
        uses: taskmedia/action-conventional-commits@v1.1.0
        with:
          types: "feat|fix|ci|docs|perf|refactor|build|test|chore"

      - name: Build image
        run: $DOCKER_CMD build

      - name: Run pre-commit
        run: $DOCKER_CMD run --rm dev make ci

      - name: Run Tests
        run: $DOCKER_CMD run --rm dev make test

      - name: Clean up docker env
        if: always()
        run: docker-compose down -v

      - name: Remove docker credentials
        if: always()
        run: rm -rf $DOCKER_CONFIG
