{% load dynpy_ui_tags %}
<div id="global-messages" class="message-block" hx-swap-oob='true'>
    <!-- Messages-->
    <style>
        .toast {
            min-width: 20rem
        }
        .message-block {
            position:fixed;
            top:5rem;
            right:1rem;
            z-index:1030;
        }
    </style>
    {% for message in messages %}
        <div class="toast show"
             role="alert"
             aria-live="assertive"
             aria-atomic="true"
             data-delay="{% get_toasts_delay_time message %}">
            <button type="button"
                    class="ml-2 mb-1 close mr-2 mt-1"
                    data-dismiss="toast"
                    aria-label="Close">
                <span aria-hidden="true">×</span>
            </button>
            <div class="toast-body {{ message.tags }}">{{ message }}</div>
        </div>
    {% endfor %}
    <script>$('.toast').toast('show')</script>
</div>
