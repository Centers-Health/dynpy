[tool.poetry]
name = "dynpy_ui"
version = "2.1.0"
description = ""
authors = ["Team Dynamics"]

[[tool.poetry.source]]
name = "dynamics"
url = "https://pypi.centershealthcare.org/simple/"
priority = "supplemental"


[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.djlint]
profile = "django"
blank_line_before_tag="block"
blank_line_after_tag="endblock,extends"
format_attribute_template_tags=true
max_line_length=80
preserve_leading_space=false
preserve_blank_lines=false

[tool.flakeheaven]
ignore = ["E203", "E266", "E501", "W503", "F403", "F401", "E231", "-PIE786"]
format = "colored"
max_line_length = 105
max_complexity = 18
show_source = true
select = ["B","C","E","F","W","T4","B9"]
exclude = [".git","__pycache__","docs/source/conf.py","old","build","dist",".venv"]

[tool.flakeheaven.plugins]
pyflakes = ["+*"]
# E722 covered by bugabear with better message
pycodestyle = ["+*", "-E501", "-E722"]
flake8-bugbear = ["+*"]
flake8-django = ["+*"]
flake8-simplify = ["+*"]
# PIE786 covered by bugabear with better message
flake8-pie = ["+*", "-PIE786"]
flake8-alfred = ["+*"]
flake8-pytest = ["+*"]
flake8-pytest-style = ["+*"]

[tool.pycln]
all = true
expand_stars = true

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 105

[tool.black]
line-length = 105
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.vim
  | \.vscode
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.poetry.dependencies]
python = "^3.11"
django = "^4.2"
dynpy-js = {develop = true, source="../dynamics-py-js/"}

[tool.poetry.group.dev.dependencies]
pytest-describe = "^2.0.1"
pytest-django = "^4.5.2"
pytest-watch = "^4.2.0"
pytest-spec = "^3.1.0"
pytest-xdist = "*"
pytest-mock = "*"
beautifulsoup4 = "^4.11.1"
pytest-testmon = "^1.0.3"
pdbpp = "*"
pytest-flakefinder = "^1.0.0"
django-types = "^0.16.0"
pytest = "^7.4.3"

[tool.semantic_release]
version_variable = [
    "dynpy_ui/__init__.py:__version__"
]
version_toml = [
    "pyproject.toml:tool.poetry.version"
]
upload_to_pypi = false
upload_to_repository = false
upload_to_release = true
build_command = "poetry build"
commit_message = "Automatically generated by python-semantic-release [skip ci]"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-monorepo.deps]
