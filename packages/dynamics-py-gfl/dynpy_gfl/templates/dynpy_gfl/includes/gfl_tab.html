{% load hx_tags %}
{% comment %} NOTE: Many htmx attributes can be inherited. And activeTab is coming from x-data on #gfl-tabs {% endcomment %}
<a class="nav-link"
   :class="{'active':  activeTab === '{{ tab }}'}"
   @click="activeTab = '{{ tab }}'"
   href="#"
   hx-push-url='true'
   hx-target="#gfl_table"
   hx-swap='outerHTML settle:0 show:#gfl_table:top'
   hx-indicator='#table-loader'
   hx-trigger="click delay:.2ms"
   hx-include='#basicFilters'
   {% hx_get view.tab_hx_name %}>{{ tab_title }}
    <span class="badge badge-dark align-self-center align-middle">
        <span {% hx_get view.tab_counts_hx_name %}
              class='-content'
              hx-indicator="this"
              hx-trigger="load"
              hx-include='#basicFilters'
              hx-swap='innerHTML'
              hx-push-url='false'
              hx-vals='{"gfl_tab":"{{ tab }}"}'
              hx-target='find .count-badge'>
            <span id='count-loader'
                  class="htmx-indicator d-none spinner-grow spinner-grow-sm"
                  role="status"
                  aria-hidden="true"
                  style="width:.5rem;
                         height:.5rem"></span> <span class='count-badge loaded-content'></span></span>
        </span>
    </a>
