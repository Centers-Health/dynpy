{% extends "dynpy_gfl/widgets/tab_radio_option.html" %}

{% load hx_tags %}

{% block count %}
    <span class="badge tab-count-badge"
          {% hx_get count_hx_name %}
          hx-include="{{ hx_include }}"
          hx-trigger="load"
          hx-vals='{"{{ widget.name }}": "{{ option.value }}"}'
          hx-target="this"
          hx-swap="innerHTML"
          hx-push-url="false"
          hx-indicator="unset"></span>
{% endblock count %}
