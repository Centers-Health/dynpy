<input type="radio"
       name="{{ widget.name }}"
       value="{{ option.value }}"
       id="{{ option.attrs.id }}"
       {% if option.attrs.checked %}checked{% endif %}
       autocomplete="off"
       {% include "django/forms/widgets/attrs.html" %}>
<label for="{{ option.attrs.id }}"
       class="btn btn-outline-primary btn-sm mb-0">
    {{ option.label }}

    {% block count %}
    {% endblock count %}

</label>
