[tool.poetry]
name = "dynpy_cas"
version = "7.0.0"
description = ""
authors = ["Team Dynamics"]

[[tool.poetry.source]]
name = "dynamics"
url = "https://pypi.centershealthcare.org/simple/"
priority = "supplemental"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.poetry.dependencies]
python = "^3.11"
django = "^4.2"
django-cas-ng = "^4.3.0"
python-dateutil = "^2.8.2"
premailer = "^3.10.0"
html2text = "^2020.1.16"
pyodbc = "^4.0.32"
dynpy = {path = "../dynamics-py-core", develop = true}

[tool.poetry.group.dev.dependencies]
pytest-watch = "^4.2.0"
pytest-spec = "^3.1.0"
pytest-testmon = "^1.0.3"
pytest-django = "^4.5.2"
pytest-describe = "^2.0.1"
pytest-mock = "*"
bs4 = "^0.0.1"
pytest-xdist = "*"
pdbpp = "*"
pytest-flakefinder = "^1.0.0"
pytest = "^7.4.3"
django-types = "^0.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-monorepo.deps]
