version: '3.3'

services:
    dev:
        container_name: dynamics-py-actions-dev
        image: dynamics-dev-image:latest
        restart: unless-stopped
        stdin_open: true
        tty: true
        expose:
            - 8000
        volumes:
            - ./:/app:rw
            - ${HOME}/.local-overrides:/home/docker/.config/local-overrides
            - $HOME/.cache/devcontainer:/home/docker/.cache/devcontainer


networks:
    default:
        external: true
        name: nginx-proxy
