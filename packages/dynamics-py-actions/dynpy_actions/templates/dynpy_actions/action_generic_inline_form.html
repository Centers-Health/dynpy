{% load crispy_forms_tags %}
{% load actions_tags %}
<div id="actions_wrapper_{{ action_kwargs.action__id }}"
     class="action-wrapper
            {% if action.embed_type == action.embed_type.INLINE %}d-inline{% endif %}"
     data-action-id="{{ action_kwargs.action__id }}"
     data-loader-style="dots"
     {% render_kwargs_as_data_attributes action_kwargs %}
     style="font-size:1rem"
     {% if action.pre_render == False %}data-js-load-action-form{% endif %}
     data-action-type="inline">
    {% if action.pre_render %}
        {% include action.form_template %}
    {% endif %}
</div>
