{% load crispy_forms_tags %}
{% load actions_tags %}

{% block form %}
    <form style="font-size:initial"
          action="{{ request.path|build_url_with_query:action_kwargs }}"
          method="POST"
          enctype="multipart/form-data"
          class="
                 {% if action.async_validation %}
                     js-async-validate
                 {% endif %}
                 {% if action.async_confirmation %}
                     js-async-confirm
                 {% endif %}
                 {% if action.embed_type == action.embed_type.INLINE %}
                     form-inline d-inline-block
                 {% endif %}
                 {% if action.needs_confirmation %}
                     js-form-confirm
                 {% endif %}
                 {% if action.autosubmit %}
                     js-form-autosubmit
                 {% endif %}"
          {% if action.callback %}
              data-callback="{{ action.callback }}"
          {% endif %}
          data-validate-on="{{ action.validate_on }}"
          {% if action.needs_confirmation %}
              data-message="{{ action.confirmation_text }}"
          {% endif %}>

        {% block form_layout %}
            {% crispy form %}
        {% endblock form_layout %}

    </form>
{% endblock form %}
