{% load dynpy_tags %}
<!--Start of Tawk.to Script-->
<script type="module">
window.Tawk_API = window.Tawk_API || {};
var Tawk_LoadStart = new Date();

window.Tawk_API.visitor = {
    {%if user %}
      name: "{{user.fullname}}",
      email: "{{user.email}}",
      hash: "{% hash_hmac data=user.email %}",
      {% else %}
      email: "anonymoususer@chcapps.com",
      hash: "{% hash_hmac data='anonymoususer@chcapps.com' %}",
      {% endif %}
};

(function () {
  var s1 = document.createElement("script"),
  s0 = document.getElementsByTagName("script")[0];
  s1.async = true;
  s1.src = "{{ tawkto_embed_url }}";
  s1.charset = "UTF-8";
  s1.setAttribute("crossorigin", "*");
  s0.parentNode.insertBefore(s1, s0);
})();

import isFastNet from "https://cdn.jsdelivr.net/npm/isfastnet@2.0.0";
var user_speed = null;
isFastNet(
  (value) => {
    user_speed = value ? "Fast" : "Slow";
  },
  {
    timesToTest: 5, // optional, number of times to load the image, default is 5
    threshold: 200, // optional, threshold in ms after which internet speed is considered slow
    image: "https://www.google.com/images/phd/px.gif", //  optional, url of the tiny image to load
    allowEarlyExit: true, // optional, if the first request takes greater than threshold*3 ms then the function exits with false
  },
);

{% if manual_mode %}
window.Tawk_API.onBeforeLoad = function () {
  try {
    window.Tawk_API.hideWidget();
  } catch (e) {
    console.log(e)
  }
  let help_badge = document.getElementById("help_badge");
  if (help_badge) {
    help_badge.addEventListener("click", () => {
      window.Tawk_API.popup();
    });
  }
};
{% endif %}

setTimeout(() => {
        if (typeof window.Tawk_API.setAttributes === "function") {
            window.Tawk_API.setAttributes({
                  "internet-speed": user_speed,
            }, function (error) { })
        }
    }, 2000
);

</script>
<!--End of Tawk.to Script-->
