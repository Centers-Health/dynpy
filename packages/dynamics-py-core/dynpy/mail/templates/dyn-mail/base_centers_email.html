<!DOCTYPE html>

{% block load_extras %}
{% endblock load_extras %}

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
    </head>
    <body>
        <div style="background-color:#d2d2d2">
            <div class="container"
                 style="width:75%;
                        padding:3rem 15px 3rem 15px;
                        margin:auto">
                <div class="card"
                     style="position:relative;
                            background-color:#fff;
                            border-radius:0.25rem">
                    <div class="card-body" style="padding:1.25rem">
                        <div class="card-title"
                             style="margin-top:0;
                                    margin-bottom:0;
                                    font-size:1.25rem;
                                    text-align:center">
                            <img height="55px" alt="Centers Logo" src="cid:centers-header-logo">
                        </div>
                        <p class="card-text">

                            {% block content %}
                            {% endblock content %}

                        </p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
