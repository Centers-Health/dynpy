[tool.poetry]
name = "dynpy"
version = "18.1.0"
description = ""
authors = ["Team Dynamics"]

[[tool.poetry.source]]
name = "dynamics"
url = "https://pypi.centershealthcare.org/simple"
priority = "supplemental"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.flakeheaven]
ignore = ["E203", "E266", "E501", "W503", "F403", "F401", "E231", "-PIE786"]
format = "colored"
max_line_length = 105
max_complexity = 18
show_source = true
select = ["B","C","E","F","W","T4","B9"]
exclude = [".git","__pycache__","docs/source/conf.py","old","build","dist",".venv"]
baseline = "flake8_baseline.txt"

[tool.flakeheaven.plugins]
pyflakes = ["+*"]
# E722 covered by bugabear with better message
pycodestyle = ["+*", "-E501", "-E722", "-W503"]
flake8-bugbear = ["+*"]
flake8-django = ["+*"]
flake8-simplify = ["+*"]
# PIE786 covered by bugabear with better message
flake8-pie = ["+*", "-PIE786"]
flake8-alfred = ["+*"]
flake8-pytest = ["+*"]
flake8-pytest-style = ["+*"]

[tool.black]
line-length = 105
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | \.vim
  | \.vscode
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.djlint]
profile = "django"
blank_line_before_tag="block"
blank_line_after_tag="endblock,extends"
format_attribute_template_tags=true
max_line_length=80
preserve_leading_space=false
preserve_blank_lines=false
ignore = "H005,H006,H008,H013,H016,H021,H030,H031,D018"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 105

[tool.pycln]
all = true
expand_stars = true

[tool.poetry.dependencies]
python = "^3.11"
django = "^4.2"
python-dateutil = "^2.8.2"
premailer = "^3.10.0"
html2text = "^2020.1.16"
pyodbc = "^4.0.32"
strawberry-graphql = "0.235.2" #TODO: pinned because breaks on 0.237.0
strawberry-graphql-django = ">=0.20.0,<1.0.0"
django-plausible-proxy = "^0.3.0"
PyJWT = ">=1.7.1,<3.0"
django-admin-display = "^1.3.0"
cryptography = ">=38.0"
packaging = "^23.1"
typing-extensions = "^4.5.0"
djangorestframework = "^3.12.4"

[tool.poetry.group.dev.dependencies]
asgiref = ">=3.3.2,<4"
pytest = "^7.4.3"
pytest-watch = "^4.2.0"
pytest-spec = "^3.1.0"
pytest-testmon = "^1.0.3"
pytest-django = "^4.5.2"
pytest-describe = "^2.0.1"
pytest-mock = "*"
bs4 = "^0.0.1"
pytest-xdist = "*"
pdbpp = "*"
pytest-flakefinder = "^1.0.0"
django-types = "^0.17.0"
djangorestframework-stubs = "^1.4.0"
django-mock-queries = "^2.1.7"
freezegun = "^1.5.1"

[tool.semantic_release]
version_variable = [
    "dynpy/__init__.py:__version__"
]
version_toml = [
    "pyproject.toml:tool.poetry.version"
]
upload_to_pypi = false
upload_to_repository = false
upload_to_release = true
build_command = "poetry build"
commit_message = "Automatically generated by python-semantic-release [skip ci]"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry-monorepo.deps]
