name: CI

on:
  pull_request:
    branches: [master]

env:
  DOCKER_CONFIG: /home/enviro/.docker/dynamics-py-actions-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}
  DOCKER_CMD: docker compose -f devops/ci/docker-compose.yml
  COMPOSE_PROJECT_NAME: ${{ github.event.repository.name }}-monorepo-ci-${{ github.event.pull_request.number }}
  IMAGE_NAME: dynpy-monorepo-${{ github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.repository.name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: [self-hosted, ciplus]
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PKG_TOKEN }}

      - uses: actions/checkout@v6

      - name: Build image
        run: $DOCKER_CMD build --pull

  PreCommit:
    runs-on: [self-hosted, ciplus]
    needs: [Build]
    steps:
      - uses: actions/checkout@v6
      - name: Run ci
        run: $DOCKER_CMD run --rm dev make precommit

  Tests:
    runs-on: [self-hosted, ciplus]
    needs: [Build]
    steps:
      - uses: actions/checkout@v6
      - name: Run ci
        run: $DOCKER_CMD run --rm dev make test

  ConventionalCommit:
    runs-on: [self-hosted, ciplus]
    steps:
      - uses: actions/checkout@v6
      - name: Verify conventional commits
        uses: taskmedia/action-conventional-commits@v1.1.26
        with:
          types: "feat|fix|ci|docs|perf|refactor|build|test|chore"

  Cleanup:
    runs-on: [self-hosted, ciplus]
    needs: [Tests, PreCommit]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Clean up docker env
        if: always()
        run: $DOCKER_CMD down -v
      - name: Remove docker credentials
        run: rm -rf $DOCKER_CONFIG
