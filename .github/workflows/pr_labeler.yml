name: Labeler

on:
  pull_request:
    branches: [master]

env:
  COMPOSE_HTTP_TIMEOUT: 200

jobs:
  Label:
    runs-on: [self-hosted, ciplus]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
