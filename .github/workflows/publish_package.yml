name: CD

on:
  push:
    branches: [master]

env:
  POETRY_HTTP_BASIC_DYNAMICS_USERNAME: admin
  POETRY_HTTP_BASIC_DYNAMICS_PASSWORD: ${{secrets.PYPI_PASSWORD}}
  POETRY_VIRTUALENVS_OPTIONS_ALWAYS_COPY: false

jobs:
  release:
    runs-on: [self-hosted, ciplus]
    concurrency: release
    if: "!contains(github.event.head_commit.message, 'VERSION BUMP')"
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          token: ${{secrets.ADMIN_TOKEN}}
          fetch-depth: 0

      - name: Configure CI Git User
        run: |
          git config user.name '@system-admin'
          git config user.email 'system-admin@users.noreply.github.com'

      - uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install SPM and poetry
        run: |
          pip install poetry==1.8.3
          pip install --force-reinstall packages/semantic-python-monorepo

      - name: Install Poetry Plugins
        run: |
          poetry self add poetry-bumpversion
          poetry self add poetry-plugin-mono-repo-deps
          # reset this back, since 20.31.x has a breaking change
          pip install virtualenv==20.30.0

      - name: Run SPM
        run: spm -vvv
        env:
          GH_TOKEN: ${{ github.token }}
