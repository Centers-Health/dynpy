DevOps:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - "devops/**"
              - ".github/**"

Packages:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - poetry.lock
              - pyproject.toml
              - yarn.lock
              - package.json

Configs:
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .gitignore
              - .prettierc
              - .eslintrc.js
              - docker-compose.yml
              - poetry.toml
              - pyproject.toml
              - pytest.ini
              - .coveragerc

arithmetic:
  - any:
      - changed-files:
