DevOps:
  - changed-files:
      - any-glob-to-any-file:
          - "devops/**"
          - ".github/**"

Packages:
  - changed-files:
      - any-glob-to-any-file:
          - poetry.lock
          - pyproject.toml
          - yarn.lock
          - package.json

Configs:
  - changed-files:
      - any-glob-to-any-file:
          - .gitignore
          - .prettierc
          - .eslintrc.js
          - docker-compose.yml
          - poetry.toml
          - pyproject.toml
          - pytest.ini
          - .coveragerc

arithmetic:
  - changed-files:
      - any-glob-to-any-file: "packages/arithmetic/**"

calculator:
  - changed-files:
      - any-glob-to-any-file: "packages/calculator/**"

semantic-python-monorepo:
  - changed-files:
      - any-glob-to-any-file: "packages/semantic-python-monorepo/**"
