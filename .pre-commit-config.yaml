default_stages: [commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: check-yaml
        name: "Yaml: Check"
      - id: end-of-file-fixer
        name: "General: Fix end of files"
      - id: trailing-whitespace
        name: "General: Fix Trailing whitespace"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v2.2.1"
    hooks:
      - id: prettier
        name: "JS> Prettier"
        files: '.*\.js$'

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: "v7.25.0"
    hooks:
      - id: eslint
        name: "JS> Eslint"

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: "v2.0.0"
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [] # optional: list of Conventional Commits types to allow e.g. [feat, fix, ci, chore, test]

  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.32.1
    hooks:
      - id: djlint-django
        name: Django djLint
        files: '.*\.html$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.4
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      # FIXME: Not sure how to do this check in monorepo
      # - id: migrations
      #   name: 'Django: Migrations Check'
      #   entry: .venv/bin/python manage.py makemigrations --check --no-input
      #   language: system
      #   pass_filenames: false
      #   files: '.*\.py$'

      - id: statictemplatetags
        name: "Django: Static template tag leading slash"
        entry: static ["']/
        args: [-i]
        language: pygrep
        files: '.*\.html$'

      - id: naive-check-merge-conflict
        name: "Git: Check Merge Conflicts"
        entry: "^(<<<<<<< |======= |>>>>>>> |=======$)"
        language: pygrep
        stages: [push]
        always_run: true

      - id: check-empty-endblock
        name: "Django: Missing blockname for endblock in template"
        entry: "{%\\s*endblock\\s*%}"
        language: pygrep
        stages: [commit]
        types: [html]
